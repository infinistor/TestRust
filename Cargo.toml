[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/infinistor/awscli-rust"
publish = false

[workspace.dependencies]
awscli-rust-common = { path = "crates/common" }
awscli-rust-config = { path = "crates/config" }
awscli-rust-model = { path = "crates/model" }
awscli-rust-s3 = { path = "crates/s3" }
awscli-rust-clients = { path = "crates/clients" }
awscli-rust-scenarios = { path = "crates/scenarios" }
awscli-rust-distributed = { path = "crates/distributed" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rust_decimal = "1"
base64 = "0.23"
crc = "3"
hex = "0.4"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
quick-xml = "0.42"
md-5 = "0.11"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
rand = "0.9"
regex = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "native-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
zeromq = "0.6"
# 순수 Rust MySQL 클라이언트(UsedSizeTest). zlib·native-tls·TLS 없이 최소 기능만 쓴다.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
encoding_rs = "0.8"

[workspace.lints.rust]
# deny: crates/cli/src/main.rs의 할당기 옵션 설정만 #[allow(unsafe_code)]로 허용한다.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
