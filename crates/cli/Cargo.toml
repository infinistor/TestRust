[package]
name = "awscli-rust-cli"
description = "awscli-rust 실행 파일: 옵션 파서와 명령 디스패치 (TESTCore Program.cs, Cli/*, Commands/*)"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "awscli-rust"
path = "src/main.rs"

[[test]]
name = "parity_version"
path = "../../tests/parity/version.rs"

[[test]]
name = "parity_cli_parse"
path = "../../tests/parity/cli_parse.rs"

[[test]]
name = "parity_cli_help"
path = "../../tests/parity/cli_help.rs"

[[test]]
name = "parity_cli_run"
path = "../../tests/parity/cli_run.rs"

[[test]]
name = "parity_distributed_e2e"
path = "../../tests/parity/distributed_e2e.rs"

[dependencies]
awscli-rust-clients.workspace = true
awscli-rust-common.workspace = true
awscli-rust-config.workspace = true
awscli-rust-distributed.workspace = true
awscli-rust-model.workspace = true
awscli-rust-s3.workspace = true
awscli-rust-scenarios.workspace = true
aws-sdk-s3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
base64.workspace = true
md-5.workspace = true
rust_decimal.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Linux 정적(musl) 빌드에서만 mimalloc을 쓴다(src/main.rs).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true
libmimalloc-sys.workspace = true

[lints]
workspace = true

[dev-dependencies]
axum.workspace = true
encoding_rs.workspace = true
hex.workspace = true
md-5.workspace = true
quick-xml.workspace = true
regex.workspace = true
tempfile.workspace = true
